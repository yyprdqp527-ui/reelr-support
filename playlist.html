<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Reelr — Playlist partagée</title>
<link rel="apple-touch-icon" href="https://yyprdqp527-ui.github.io/reelr-support/reelr-icon.png">
<link rel="icon" type="image/png" href="https://yyprdqp527-ui.github.io/reelr-support/reelr-icon.png">
<meta property="og:site_name" content="Reelr">
<meta property="og:title" content="Reelr — Playlist partagée">
<meta property="og:description" content="Ouvre-la dans Reelr pour choisir les liens que tu veux garder.">
<meta property="og:image" content="https://yyprdqp527-ui.github.io/reelr-support/reelr-icon.png">
<meta property="og:type" content="website">
<style>
  :root {
    --bg: #0A0E1F;
    --card-border: rgba(255,255,255,0.06);
    --text-primary: #F7F7FB;
    --text-secondary: rgba(255,255,255,0.5);
    --accent: #A855F7;
    --accent-dark: #7C3AED;
    --gradient-start: #7C3AED;
    --gradient-end: #A855F7;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }
  .logo-row {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 32px;
  }
  .logo-text {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #8B5CF6 0%, #2563EB 60%, #22D3EE 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .card {
    background: var(--bg);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    padding: 28px 24px 32px;
    text-align: center;
  }
  .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.4px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .title {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.3;
    margin: 0 0 10px;
  }
  .subtitle {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.6;
    margin: 0 0 24px;
  }
  .thumbs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 2px 20px;
    margin-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .thumbs::-webkit-scrollbar { display: none; }
  .thumb {
    flex: 0 0 auto;
    width: 88px;
    height: 132px;
    border-radius: 14px;
    background-color: rgba(255,255,255,0.06);
    background-size: cover;
    background-position: center;
    border: 1px solid var(--card-border);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .thumb-platform-logo {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: contain;
  }
  /* Logo de site : pastille blanche, sinon un logo sombre disparait. */
  .thumb-platform-logo.site-logo {
    width: 44px;
    height: 44px;
    padding: 6px;
    border-radius: 10px;
    background: #fff;
  }
  .thumb-unavailable-badge {
    position: absolute;
    left: 4px;
    right: 4px;
    bottom: 4px;
    padding: 3px 5px;
    border-radius: 6px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 8px;
    font-weight: 600;
    text-align: center;
    line-height: 1.2;
  }
  .thumb-more {
    flex: 0 0 auto;
    width: 88px;
    height: 132px;
    border-radius: 14px;
    background: rgba(124,58,237,0.18);
    border: 1px solid var(--card-border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
  }
  .cta {
    display: block;
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
    color: white;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    margin-top: 8px;
  }
  .fallback-note {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 16px;
    line-height: 1.5;
  }
  .fallback-note a {
    color: var(--accent);
    text-decoration: none;
  }
  .error-card, .loading-card {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
  }
  .spinner {
    width: 32px;
    height: 32px;
    margin: 0 auto 16px;
    border: 3px solid rgba(168,85,247,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo-row">
      <div class="logo-text">Reelr</div>
    </div>
    <div id="content"></div>
  </div>

<script>
(function () {
  var STRINGS = {
    fr: {
      eyebrow: "PLAYLIST PARTAGÉE",
      titleTemplate: "Un ami te propose de découvrir sa playlist « {name} »",
      subtitleTemplate: "{count} lien(s) sélectionné(s) pour toi. Ouvre-la dans Reelr pour choisir ceux que tu veux garder.",
      cta: "Ouvrir dans Reelr",
      fallbackNote: "Tu n'as pas encore Reelr ? Tu vas être redirigé vers le store dans un instant, ou",
      fallbackLink: "clique ici",
      errorTitle: "Lien invalide",
      errorSubtitle: "Cette playlist n'a pas pu être chargée. Demande à ton ami de te renvoyer le lien.",
      loading: "Chargement de la playlist…",
      thumbUnavailable: "Vignette non disponible",
      more: "encore"
    },
    en: {
      eyebrow: "SHARED PLAYLIST",
      titleTemplate: "A friend wants to share their playlist \u201c{name}\u201d",
      subtitleTemplate: "{count} link(s) picked for you. Open it in Reelr to choose the ones you want to keep.",
      cta: "Open in Reelr",
      fallbackNote: "Don't have Reelr yet? You'll be redirected to the store shortly, or",
      fallbackLink: "click here",
      errorTitle: "Invalid link",
      errorSubtitle: "This playlist couldn't be loaded. Ask your friend to send the link again.",
      loading: "Loading playlist…",
      thumbUnavailable: "Thumbnail unavailable",
      more: "more"
    }
  };

  var APP_STORE_URL = "https://apps.apple.com/app/id6779609511";
  var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.room79.reelr";
  var DATA_ENDPOINT = "https://reelr-link-shortener.myreelr.workers.dev/data/";
  var FAVICON_ENDPOINT = "https://reelr-proxy.myreelr.workers.dev/favicon?url=";

  function detectLang() {
    var nav = navigator.language || navigator.userLanguage || "en";
    return nav.toLowerCase().indexOf("fr") === 0 ? "fr" : "en";
  }

  function detectPlatform() {
    var ua = navigator.userAgent || "";
    if (/iPhone|iPad|iPod/i.test(ua)) return "ios";
    if (/Android/i.test(ua)) return "android";
    return "unknown";
  }

  function storeUrlFor(platform) {
    if (platform === "ios") return APP_STORE_URL;
    if (platform === "android") return PLAY_STORE_URL;
    return APP_STORE_URL;
  }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  var PLATFORM_LOGOS = [
    { match: /facebook\.com/i, logo: "icons/facebook.png" },
    { match: /instagram\.com/i, logo: "icons/instagram.png" },
    { match: /tiktok\.com/i, logo: "icons/tiktok.png" },
    { match: /youtube\.com|youtu\.be/i, logo: "icons/youtube.png" },
    { match: /twitch\.tv/i, logo: "icons/twitch.png" },
    { match: /pinterest\.[a-z]+/i, logo: "icons/pinterest.png" },
    { match: /reddit\.com/i, logo: "icons/reddit.png" },
    { match: /linkedin\.com/i, logo: "icons/linkedin.png" }
  ];

  function platformLogoFor(url) {
    for (var i = 0; i < PLATFORM_LOGOS.length; i++) {
      if (PLATFORM_LOGOS[i].match.test(url || "")) return PLATFORM_LOGOS[i].logo;
    }
    return null;
  }

  // Logo à afficher : celui de la plateforme, sinon celui du site.
  function logoFor(url) {
    return platformLogoFor(url) || (url ? FAVICON_ENDPOINT + encodeURIComponent(url) : null);
  }

  // Nom du site sans « www. » (ex. « amazon.fr »), ou null.
  function siteNameFor(url) {
    try {
      return new URL(url).hostname.replace(/^www\./i, "") || null;
    } catch (e) {
      return null;
    }
  }

  // Bandeau du bas : « Vignette non disponible » pour un réseau social,
  // le nom du site pour un site quelconque (plus utile, jamais vide).
  function badgeFor(url, t) {
    var label = platformLogoFor(url) ? t.thumbUnavailable : (siteNameFor(url) || t.thumbUnavailable);
    return '<div class="thumb-unavailable-badge">' + escapeHtml(label) + '</div>';
  }

  // Si le logo ne charge pas, il disparaît : le bandeau reste.
  function logoImgHtml(logo) {
    if (!logo) return "";
    var isSite = logo.indexOf(FAVICON_ENDPOINT) === 0;
    return '<img class="thumb-platform-logo' + (isSite ? ' site-logo' : '') + '" src="' +
      escapeHtml(logo) + '" onerror="this.remove()">';
  }

  var _thumbCounter = 0;

  function thumbHtmlFor(item, t) {
    var logo = logoFor(item.u);
    var badge = badgeFor(item.u, t);
    if (item.th) {
      // Vignette connue : tentee en premier ; un passage ulterieur
      // (preloadThumbnails, appele une fois tout le HTML injecte) bascule
      // automatiquement sur le logo de plateforme si l'image echoue a
      // charger, meme logique que dans l'app (tokens Facebook a duree de
      // vie tres courte, expirent souvent avant meme l'ouverture du lien
      // par le destinataire). Jamais de balise de fermeture de script
      // injectee dans le HTML ici : le navigateur repere cette sequence de
      // caracteres partout dans le flux HTML brut, meme au milieu d'un
      // commentaire ou d'une chaine JS, et referme le bloc en cours.
      var thumbId = "thumb-" + (_thumbCounter++);
      return '<div class="thumb" id="' + thumbId + '" style="background-image:url(\'' + escapeHtml(item.th) + '\')" ' +
        'data-thumb-url="' + escapeHtml(item.th) + '" data-thumb-logo="' + escapeHtml(logo || '') + '" ' +
        'data-thumb-page="' + escapeHtml(item.u || '') + '"></div>';
    }
    // Pas de vignette du tout : logo (plateforme ou site) direct.
    return '<div class="thumb">' +
      logoImgHtml(logo) +
      badge +
      '</div>';
  }

  function preloadThumbnails(t) {
    document.querySelectorAll(".thumb[data-thumb-url]").forEach(function (el) {
      var url = el.getAttribute("data-thumb-url");
      var logo = el.getAttribute("data-thumb-logo");
      var page = el.getAttribute("data-thumb-page");
      var img = new Image();
      img.onerror = function () {
        el.style.backgroundImage = "none";
        el.innerHTML = logoImgHtml(logo) + badgeFor(page, t);
      };
      img.src = url;
    });
  }

  function showLoading(t) {
    var content = document.getElementById("content");
    content.innerHTML =
      '<div class="card loading-card">' +
        '<div class="spinner"></div>' +
        '<div>' + t.loading + '</div>' +
      '</div>';
  }

  function showError(t) {
    var content = document.getElementById("content");
    content.innerHTML =
      '<div class="card error-card">' +
        '<div class="title">' + t.errorTitle + '</div>' +
        '<div class="subtitle">' + t.errorSubtitle + '</div>' +
      '</div>';
  }

  function decodeItems(encoded) {
    var base64 = encoded.replace(/-/g, "+").replace(/_/g, "/");
    var padded = base64 + "===".slice((base64.length + 3) % 4);
    var json = decodeURIComponent(escape(window.atob(padded)));
    var items = JSON.parse(json);
    if (!Array.isArray(items) || items.length === 0) return null;
    return items;
  }

  function renderPlaylist(t, platform, name, items, code, rawEncodedItems) {
    var content = document.getElementById("content");

    // Le lien vers l'app transporte a la fois le code (nouvelle version de
    // l'app : va chercher les donnees via /data/:code) ET name/items en
    // clair (versions de l'app deja installees avant ce changement, qui ne
    // savent lire que ce format). Cette redondance n'a aucun cout : ce lien
    // n'est jamais envoye par SMS, seule la limite de taille du lien court
    // partage par SMS comptait (voir handleRedirect cote Worker).
    // Lien de secours sans code (Worker injoignable au moment du partage) :
    // on n'envoie que name/items, que toutes les versions de l'app lisent.
    var appLink = "reelr://playlist?" +
        (code ? "code=" + encodeURIComponent(code) + "&" : "") +
        "name=" + encodeURIComponent(name) +
        "&items=" + encodeURIComponent(rawEncodedItems);
    var storeUrl = storeUrlFor(platform);

    var maxThumbs = 6;
    var thumbsHtml = "";
    items.slice(0, maxThumbs).forEach(function (item) {
      thumbsHtml += thumbHtmlFor(item, t);
    });
    if (items.length > maxThumbs) {
      thumbsHtml += '<div class="thumb-more">+' + (items.length - maxThumbs) + '</div>';
    }

    var title = t.titleTemplate.replace("{name}", escapeHtml(name));
    var subtitle = t.subtitleTemplate.replace("{count}", items.length);

    content.innerHTML =
      '<div class="card">' +
        '<div class="eyebrow">' + t.eyebrow + '</div>' +
        '<div class="title">' + title + '</div>' +
        '<div class="subtitle">' + subtitle + '</div>' +
        '<div class="thumbs">' + thumbsHtml + '</div>' +
        '<a class="cta" id="openBtn" href="' + appLink + '">' + t.cta + '</a>' +
        '<div class="fallback-note">' + t.fallbackNote + ' <a href="' + storeUrl + '">' + t.fallbackLink + '</a></div>' +
      '</div>';
    preloadThumbnails(t);

    var openBtn = document.getElementById("openBtn");
    // Pas de preventDefault() ici : un clic natif sur <a href="reelr://...">
    // ouvre l'app de façon bien plus fiable (notamment sur iOS Safari)
    // qu'une navigation déclenchée en JS. Le lien navigue naturellement ;
    // on programme juste un repli vers le store, annulé dès que la page
    // quitte le premier plan (preuve que l'app s'est ouverte).
    openBtn.addEventListener("click", function () {
      var redirected = false;
      var toStore = function () {
        if (redirected) return;
        redirected = true;
        window.location.href = storeUrl;
      };
      var cancel = function () { redirected = true; };
      window.addEventListener("blur", cancel, { once: true });
      window.addEventListener("pagehide", cancel, { once: true });
      document.addEventListener("visibilitychange", function onVis() {
        if (document.hidden) {
          cancel();
          document.removeEventListener("visibilitychange", onVis);
        }
      });
      setTimeout(toStore, 1500);
    });
  }

  function init() {
    var lang = detectLang();
    var t = STRINGS[lang];
    var platform = detectPlatform();
    var params = new URLSearchParams(window.location.search);
    var code = params.get("code");

    if (!code) {
      // Lien long de secours : toute la playlist est dans l'adresse.
      var name = params.get("name");
      var rawItems = params.get("items");
      if (!name || !rawItems) {
        showError(t);
        return;
      }
      try {
        var localItems = decodeItems(rawItems);
        if (!localItems) throw new Error("invalid items");
        renderPlaylist(t, platform, name, localItems, null, rawItems);
      } catch (e) {
        showError(t);
      }
      return;
    }

    showLoading(t);

    fetch(DATA_ENDPOINT + encodeURIComponent(code))
      .then(function (res) {
        if (!res.ok) throw new Error("fetch failed");
        return res.json();
      })
      .then(function (data) {
        if (!data || !data.name || !data.items) throw new Error("invalid data");
        var items = decodeItems(data.items);
        if (!items) throw new Error("invalid items");
        renderPlaylist(t, platform, data.name, items, code, data.items);
      })
      .catch(function () {
        showError(t);
      });
  }

  init();
})();
</script>
</body>
</html>
