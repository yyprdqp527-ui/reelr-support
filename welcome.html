<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Bienvenue dans Reelr</title>
<link rel="apple-touch-icon" href="https://yyprdqp527-ui.github.io/reelr-support/reelr-icon.png">
<link rel="icon" type="image/png" href="https://yyprdqp527-ui.github.io/reelr-support/reelr-icon.png">
<meta name="description" content="Tes liens, articles, vidéos, tutos… Retrouve tout en 2 secondes.">
<meta property="og:site_name" content="Reelr">
<meta property="og:title" content="Bienvenue dans Reelr">
<meta property="og:description" content="Tes liens, articles, vidéos, tutos… Retrouve tout en 2 secondes.">
<meta property="og:image" content="https://yyprdqp527-ui.github.io/reelr-support/reelr-icon.png">
<meta property="og:type" content="website">
<style>
  :root {
    --bg: #0A0E1F;
    --card-border: rgba(255,255,255,0.08);
    --text-primary: #F7F7FB;
    --text-secondary: rgba(255,255,255,0.6);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 56px 20px 60px;
  }
  .icon {
    display: block;
    width: 96px;
    height: 96px;
    border-radius: 22px;
    margin: 0 auto 28px;
  }
  .card {
    background: #14182B;
    border: 1px solid var(--card-border);
    border-radius: 22px;
    padding: 32px 24px 36px;
    text-align: center;
  }
  .logo-text {
    font-size: 40px;
    font-weight: 900;
    letter-spacing: -1.5px;
    margin: 0 0 18px;
    background: linear-gradient(135deg, #2563EB 0%, #22D3EE 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .title {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.3;
    margin: 0 0 12px;
  }
  .subtitle {
    font-size: 16px;
    color: var(--text-secondary);
    line-height: 1.6;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="icon" src="reelr-icon.png" alt="Reelr">
    <div class="card">
      <div class="logo-text">Reelr</div>
      <h1 class="title">Bienvenue dans Reelr</h1>
      <p class="subtitle">Tes liens, articles, vidéos, tutos…<br>Retrouve tout en 2 secondes.</p>
    </div>
  </div>
</body>
</html>
